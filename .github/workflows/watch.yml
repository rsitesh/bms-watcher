name: Avengers Doomsday ticket watcher

on:
  schedule:
    - cron: "3-59/10 * * * *"   # every 10 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [check, test-notify, probe]
        default: check
      probe_slug:
        description: "probe only: slug of a movie running now (e.g. from its BookMyShow URL)"
        required: false
      probe_code:
        description: "probe only: its ET00xxxxxx code"
        required: false

permissions:
  contents: write

concurrency:
  group: bms-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run watcher
        env:
          BMS_EVENT_CODES: ${{ vars.BMS_EVENT_CODES }}
          BMS_DATES: ${{ vars.BMS_DATES }}
          VENUE_FILTER: ${{ vars.VENUE_FILTER }}
          HEARTBEAT_HOUR_IST: ${{ vars.HEARTBEAT_HOUR_IST }}
          CALL_ON_POSSIBLE: ${{ vars.CALL_ON_POSSIBLE }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          CALL_TO_NUMBER: ${{ secrets.CALL_TO_NUMBER }}
          MODE: ${{ inputs.mode || 'check' }}
          PROBE_SLUG: ${{ inputs.probe_slug }}
          PROBE_CODE: ${{ inputs.probe_code }}
        run: |
          case "$MODE" in
            test-notify)
              python check_tickets.py --test-notify ;;
            probe)
              BMS_MOVIE_SLUG="$PROBE_SLUG" BMS_EVENT_CODES="$PROBE_CODE" \
              BMS_DATES="today,tomorrow" MOVIE_TITLE="$PROBE_SLUG" \
              python check_tickets.py --dry-run ;;
            *)
              python check_tickets.py ;;
          esac

      - name: Save state
        if: ${{ (inputs.mode || 'check') == 'check' }}
        run: |
          git config user.name "ticket-watcher"
          git config user.email "ticket-watcher@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update watcher state [skip ci]" && git push)
